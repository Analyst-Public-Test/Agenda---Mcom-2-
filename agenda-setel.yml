name: Agenda SETEL

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 Brasília
    - cron: "0 17 * * *"   # 14:00 Brasília
  workflow_dispatch:
    inputs:
      reclassificar:
        description: "Reclassificar todos os compromissos (ignora a classificação já gravada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agenda-setel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests openpyxl

      - name: Atualizar agenda (e-Agendas + Portal da Transparência)
        run: python scripts/agenda_setel.py ${{ inputs.reclassificar && '--reclassificar' || '' }}

      - name: Gravar se houve mudança
        run: |
          git config user.name  "agenda-setel-bot"
          git config user.email "agenda-setel-bot@users.noreply.github.com"
          git add dados/agenda-setel.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Agenda SETEL: atualização $(date -u +%Y-%m-%d)"
            git push
          fi
